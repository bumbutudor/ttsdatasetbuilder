version: '3.8'

services:
  # Aplicația Principală (Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-stt-builder
    ports:
      - "8000:8000"
    volumes:
      # Date persistente
      - ./data:/app/data
      # Cache pentru Whisper (HuggingFace) ca să nu descarce la fiecare restart
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - SECRET_KEY=${SECRET_KEY:-schimba_cheia_in_productie_teslagpu}
      
      # Setări AI
      - AI_PROVIDER=ollama
      - WHISPER_MODEL_NAME=iRaduS/whisper-romanian-finetune
      
      # Conectare la containerul Ollama intern
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL_NAME=gemma3:4b
    
    restart: unless-stopped
    networks:
      - tts-network
    depends_on:
      - ollama
    
    # ACTIVARE SUPORT GPU PENTRU WHISPER (PyTorch)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Serviciul Ollama (Vision AI)
  ollama:
    image: ollama/ollama:latest
    container_name: tts-ollama
    volumes:
      # Aici se vor salva modelele descărcate prin interfața web
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - tts-network
    
    # ACTIVARE SUPORT GPU PENTRU OLLAMA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface_cache:
  ollama_data:

networks:
  tts-network:
    name: tts-stt-network
    driver: bridge
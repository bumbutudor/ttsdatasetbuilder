{% extends "base.html" %}

{% block title %}Register - TTS/STT Dataset Builder{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
        </div>
        
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join the research team</p>
        </div>
        
        <div class="alert-container"></div>
        
        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label" for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" 
                       placeholder="Your full name" autocomplete="name">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" 
                       placeholder="Choose a username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" 
                       placeholder="your.email@example.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" 
                       placeholder="Choose a strong password" required minlength="6" autocomplete="new-password">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" 
                       placeholder="Confirm your password" required autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                Create Account
            </button>
        </form>
        
        <p class="text-center mt-lg text-muted">
            Already have an account? <a href="{{ root_path }}/login">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}

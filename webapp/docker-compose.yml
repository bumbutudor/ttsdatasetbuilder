version: '3.8'

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-stt-builder
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=sqlite:///./data/app.db
      
      # Security - CHANGE IN PRODUCTION!
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-me-in-production}
      
      # AI Provider: "ollama" or "openai"
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      
      # OpenAI Settings (if using OpenAI)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      
      # Ollama Settings (if using Ollama)
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-gemma3:4b}
      
      # Whisper Model (HuggingFace)
      - WHISPER_MODEL_NAME=${WHISPER_MODEL_NAME:-iRaduS/whisper-romanian-finetune}
    volumes:
      # Persistent data storage
      - ./data:/app/data
      # Optional: mount local models for faster startup
      # - ./models:/root/.cache/huggingface
    restart: unless-stopped
    # For GPU support (uncomment if using CUDA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional: Ollama for local Vision AI (uncomment if needed)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   # For GPU support
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

volumes:
  ollama_data:

networks:
  default:
    name: tts-stt-network


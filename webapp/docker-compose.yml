services:
  # Aplicatia Principala (Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-stt-builder
    ports:
      - "8000:8000"
    volumes:
      # Date persistente
      - ./data:/app/data
      # Modelele mari sunt montate ca volum, nu incluse in imagine
      - ../models:/models:ro
      # Cache pentru Whisper (HuggingFace) ca sa nu descarce la fiecare restart
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - SECRET_KEY=${SECRET_KEY:-schimba_cheia_in_productie_teslagpu}

      # Setari AI
      - AI_PROVIDER=ollama
      - WHISPER_MODEL_NAME=/models/FineTunedWhisperModel
      - WHISPER_PRELOAD_ON_STARTUP=true
      - HF_TOKEN=${HF_TOKEN:-}

      # Conectare la containerul Ollama intern
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL_NAME=gemma3:4b

    restart: unless-stopped
    networks:
      - tts-network
    depends_on:
      - ollama

    # Activare suport GPU pentru Whisper (PyTorch)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Serviciul Ollama (Vision AI)
  ollama:
    image: ollama/ollama:latest
    container_name: tts-ollama
    volumes:
      # Aici se vor salva modelele descarcate prin interfata web
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - tts-network

    # Activare suport GPU pentru Ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface_cache:
  ollama_data:

networks:
  tts-network:
    name: tts-stt-network
    driver: bridge
